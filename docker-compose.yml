services:
  yt-view-bot:
    build: .
    container_name: yt-view-bot
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
    # Resource limits - adjust based on your VPS
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 8G
    # Required for Chrome headless
    shm_size: 2g
    restart: unless-stopped
